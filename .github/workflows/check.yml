# CI for the game (SPEC-016 §9), and the factory's post-merge net.
#
# The factory squash-merges a spec only when review, QA and the check suite are
# green, and then watches the check runs GitHub publishes for the commit that
# landed on main: a failure or a timeout there reverts the merge automatically
# (product.postMergeHealth.mode "checks" in the factory's project profile).
# Without a workflow no check runs exist, and the factory refuses to spend
# anything on a spec it could never revert — so this file is load-bearing, not
# optional. Keep it fast: the watcher waits revertWatchMinutes (25) for a verdict.
#
# Only a check run that concluded `failure` is a verdict to the watcher. One
# still running at minute 25 reads as healthy, and so does one that ended
# `cancelled` — which is what a job that runs past its own `timeout-minutes`
# ends as, not `timed_out`. That is how the single 15-minute job left main
# unverified: its e2e step was still going when the job ran out, every time.
# So:
#
# - `check` and every e2e part run side by side (no `needs:`), each its own
#   check run from the start;
# - every budget fails: Playwright's `--global-timeout` first, then the step's
#   `timeout-minutes` (a step that times out is a failed step). A job-level
#   `timeout-minutes` is only a backstop for setup that hangs.
#
# The e2e parts run on macOS because that is where a hosted runner has a GPU.
# The Linux runners have none, and headless Chromium rasterised WebGL there
# with SwiftShader on four shared vCPUs: the menu drew at about one frame a
# second on `medium`, the fixed-step loop sat on its five-steps-a-frame ceiling
# (SPEC-002 §4.2) so every in-game timer ran several times slower than the wall
# clock, and each part failed on frame counts and timeouts — no e2e run was
# green from SPEC-006 on. A macOS runner carries a paravirtualised Metal GPU,
# which the full Chromium build uses (`E2E_CHANNEL`, playwright.config.ts); the
# default headless shell never does, on any host. `E2E_REQUIRE_GPU` makes the
# run fail in its first second if that ever stops being true
# (e2e/global-setup.ts), rather than as a wall of timeouts.
name: check
on:
  push:
    branches: [main]
  pull_request:
  # A manual run, for timing a branch or asking again about a commit.
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # typecheck (src and tests), unit tests, production build
      - run: npm run check
        timeout-minutes: 5

  e2e:
    name: e2e ${{ matrix.part }}
    runs-on: macos-15
    timeout-minutes: 22
    strategy:
      # A cancelled part is no verdict, and every part's failures are worth
      # having, so one red part does not stop the others.
      fail-fast: false
      matrix:
        # Five parts, because the Free plan runs at most five macOS jobs at
        # once: a sixth would queue behind the others and double the wall time.
        part: ['1/5', '2/5', '3/5', '4/5', '5/5']
    env:
      E2E_CHANNEL: chromium
      E2E_REQUIRE_GPU: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The full build only: `E2E_CHANNEL=chromium` never launches the shell.
      # The browser revision follows the pinned @playwright/test.
      - run: npx playwright install --no-shell chromium
      # The parts are planned by time, not count (scripts/e2e/shard.mjs).
      # `--shard` split by count, and the budget had to grow every few specs
      # with no test failing: 8 → 10 minutes (#57, #60), 10 → 13 (#66, #67),
      # each time because one part had drawn the slow scene tests while another
      # sat idle — the part that ran only SPEC-011 and SPEC-012-missions used
      # four of its nine minutes. Every part now plans the whole suite from
      # `scripts/e2e/timings.json` and the same commit, so the five agree
      # without a planning job (no `needs:`, see above), and runs its own share
      # with `--test-list`. The plan is printed at the top of the step, and a
      # warning is raised when the longest part plans past three quarters of
      # the budget or a fifth of the tests have no timing yet.
      #
      # The retry is CI's alone: playwright.config.ts keeps `retries: 0` for
      # the factory's gate, which runs its own re-run protocol, and without one
      # here a contention flake the gate forgave would revert a good merge. The
      # global timeout fails a part that overruns with its unfinished tests
      # named, early enough for the watcher to see it. Sixteen minutes leaves a
      # part planned at ten room for a slow day's runners and for its retries.
      # On 2026-10-08 the suite planned at 10.1 minutes a part, and the same
      # tests ran 15–20 % longer on main and on #115 than on the run the timings
      # came from, so three parts ran out of thirteen with no test failing.
      # A longer budget needs a longer watcher window (revertWatchMinutes,
      # above): queueing, setup and this step's eighteen minutes must end
      # inside it.
      - name: playwright test ${{ matrix.part }}
        timeout-minutes: 18
        env:
          PART: ${{ matrix.part }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: e2e-report.json
        run: |
          node scripts/e2e/shard.mjs --part "$PART" --out "$RUNNER_TEMP/e2e-part.txt" --budget-ms 960000
          npx playwright test --test-list "$RUNNER_TEMP/e2e-part.txt" --workers=2 --retries=1 --global-timeout=960000 --add-reporter=github,json
      # The traces of whatever failed (trace: 'retain-on-failure').
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      # Every test's time, green or red, for refreshing the timings the parts
      # are planned with (scripts/e2e/timings.mjs).
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ strategy.job-index }}
          path: e2e-report.json
          retention-days: 30
          if-no-files-found: ignore
