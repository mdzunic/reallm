# CI for the game (SPEC-016 §9), and the factory's post-merge net.
#
# The factory squash-merges a spec only when review, QA and the check suite are
# green, and then watches the check runs GitHub publishes for the commit that
# landed on main: a failure or a timeout there reverts the merge automatically
# (product.postMergeHealth.mode "checks" in the factory's project profile).
# Without a workflow no check runs exist, and the factory refuses to spend
# anything on a spec it could never revert — so this file is load-bearing, not
# optional. Keep it fast: the watcher waits revertWatchMinutes (22) for a verdict.
#
# Only a check run that concluded `failure` is a verdict to the watcher. One
# still running at minute 22 reads as healthy, and so does one that ended
# `cancelled` — which is what a job that runs past its own `timeout-minutes`
# ends as, not `timed_out`. That is how the single 15-minute job left main
# unverified: its e2e step was still going when the job ran out, every time.
# So:
#
# - `check` and every e2e part run side by side, each its own check run; the
#   parts wait only for `prove` (seconds, and on a push to main only — see it
#   below), never for `check`;
# - every budget fails: Playwright's `--global-timeout` first, then the step's
#   `timeout-minutes` (a step that times out is a failed step). A job-level
#   `timeout-minutes` is only a backstop for setup that hangs.
#
# The e2e parts run on macOS because that is where a hosted runner has a GPU.
# The Linux runners have none, and headless Chromium rasterised WebGL there
# with SwiftShader on four shared vCPUs: the menu drew at about one frame a
# second on `medium`, the fixed-step loop sat on its five-steps-a-frame ceiling
# (SPEC-002 §4.2) so every in-game timer ran several times slower than the wall
# clock, and each part failed on frame counts and timeouts — no e2e run was
# green from SPEC-006 on. A macOS runner carries a paravirtualised Metal GPU,
# which the full Chromium build uses (`E2E_CHANNEL`, playwright.config.ts); the
# default headless shell never does, on any host. `E2E_REQUIRE_GPU` makes the
# run fail in its first second if that ever stops being true
# (e2e/global-setup.ts), rather than as a wall of timeouts.
name: check
on:
  push:
    branches: [main]
  pull_request:
  # A manual run, for timing a branch or asking again about a commit.
  workflow_dispatch:
# A pull request's run is superseded by its next push: the factory gates the
# head it pushed last and reads no older head's checks, so finishing the old run
# only holds macOS slots the new one is queueing for (the Free plan runs five at
# once, one run's worth). Pushes to main are never cancelled: every commit that
# lands is the revert watcher's to judge.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # typecheck (src and tests), unit tests, production build
      - run: npm run check
        timeout-minutes: 5

  # On a push to main: did this commit's pull request already pass the browser
  # suite on this exact tree? A squash merge of an up-to-date branch lands the
  # PR head's tree byte for byte — every one of the 20 factory merges between
  # 2026-09-26 and 10-04 did — and running the whole suite on it again held all
  # five macOS slots for ten minutes after each merge, queueing the next PR's
  # run behind it (16–24 minutes, past the watcher's 22). When the trees match
  # and every `e2e N/5` on the head concluded `success`, the parts below report
  # that proof instead of running. The same tree is the same code, tests and
  # workflow, so the verdict carries over the way a cache keyed on the tree
  # would. Anything else — no merged PR, a different tree (main moved under the
  # PR, a direct push), a part that did not pass, an unanswered API call — and
  # the parts run as before.
  prove:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      head: ${{ steps.twin.outputs.head }}
    steps:
      - id: twin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api() { gh api -H 'Accept: application/vnd.github+json' "$@"; }
          head=$(api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null)][0].head.sha // ""') \
            || { echo "::notice::could not ask which PR landed $GITHUB_SHA — the e2e parts run"; exit 0; }
          if [ -z "$head" ]; then echo "no merged PR landed $GITHUB_SHA — the e2e parts run"; exit 0; fi
          here=$(api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha) || exit 0
          there=$(api "repos/$GITHUB_REPOSITORY/git/commits/$head" --jq .tree.sha) || exit 0
          if [ "$here" != "$there" ]; then
            echo "tree $here is not PR head $head's ($there) — the e2e parts run"; exit 0
          fi
          parts=$(api "repos/$GITHUB_REPOSITORY/commits/$head/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name | test("^e2e [0-9]+/[0-9]+$")) | .conclusion]') || exit 0
          total=$(jq length <<<"$parts")
          passed=$(jq '[.[] | select(. == "success")] | length' <<<"$parts")
          if [ "$total" -eq 0 ] || [ "$passed" -ne "$total" ]; then
            echo "PR head $head's e2e parts: $parts — the e2e parts run"; exit 0
          fi
          echo "::notice::tree $here passed all $total e2e parts on PR head $head — not run again"
          echo "head=$head" >> "$GITHUB_OUTPUT"

  e2e:
    name: e2e ${{ matrix.part }}
    needs: prove
    # `prove` is skipped on a pull request, and can fail; neither may skip the
    # parts — only a proof does, and it still reports every part.
    if: ${{ !cancelled() }}
    # A proved part takes no macOS slot: it reports on Ubuntu in seconds.
    runs-on: ${{ needs.prove.outputs.head && 'ubuntu-latest' || 'macos-15' }}
    timeout-minutes: 19
    strategy:
      # A cancelled part is no verdict, and every part's failures are worth
      # having, so one red part does not stop the others.
      fail-fast: false
      matrix:
        # Five parts, because the Free plan runs at most five macOS jobs at
        # once: a sixth would queue behind the others and double the wall time.
        part: ['1/5', '2/5', '3/5', '4/5', '5/5']
    env:
      E2E_CHANNEL: chromium
      E2E_REQUIRE_GPU: '1'
    steps:
      # A proved part says what proved it and runs nothing; every step after
      # this one is the real part, and is skipped on a proof.
      - if: ${{ needs.prove.outputs.head }}
        run: echo "::notice::e2e ${{ matrix.part }} passed on PR head ${{ needs.prove.outputs.head }}, whose tree this commit has — not run again (see the prove job)"
      - if: ${{ !needs.prove.outputs.head }}
        uses: actions/checkout@v7
      - if: ${{ !needs.prove.outputs.head }}
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - if: ${{ !needs.prove.outputs.head }}
        run: npm ci
      # The full build only: `E2E_CHANNEL=chromium` never launches the shell.
      # The browser revision follows the pinned @playwright/test.
      - if: ${{ !needs.prove.outputs.head }}
        run: npx playwright install --no-shell chromium
      # The parts are planned by time, not count (scripts/e2e/shard.mjs).
      # `--shard` split by count, and the budget had to grow every few specs
      # with no test failing: 8 → 10 minutes (#57, #60), 10 → 13 (#66, #67),
      # each time because one part had drawn the slow scene tests while another
      # sat idle — the part that ran only SPEC-011 and SPEC-012-missions used
      # four of its nine minutes. Every part now plans the whole suite from
      # `scripts/e2e/timings.json` and the same commit, so the five agree
      # without a planning job to wait for (see above), and runs its own share
      # with `--test-list`. The plan is printed at the top of the step, and a
      # warning is raised when the longest part plans past three quarters of
      # the budget or a fifth of the tests have no timing yet.
      #
      # The retry is CI's alone: playwright.config.ts keeps `retries: 0` for
      # the factory's gate, which runs its own re-run protocol, and without one
      # here a contention flake the gate forgave would revert a good merge. The
      # global timeout fails a part that overruns with its unfinished tests
      # named, early enough for the watcher to see it. Thirteen minutes leaves
      # a part planned at seven room for its retries, SPEC-012-missions' three
      # and a half included. A longer budget needs a longer watcher window
      # (revertWatchMinutes, above): queueing, setup and this step's fifteen
      # minutes must end inside it.
      - name: playwright test ${{ matrix.part }}
        if: ${{ !needs.prove.outputs.head }}
        timeout-minutes: 15
        env:
          PART: ${{ matrix.part }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: e2e-report.json
        run: |
          node scripts/e2e/shard.mjs --part "$PART" --out "$RUNNER_TEMP/e2e-part.txt" --budget-ms 780000
          npx playwright test --test-list "$RUNNER_TEMP/e2e-part.txt" --workers=2 --retries=1 --global-timeout=780000 --add-reporter=github,json
      # The traces of whatever failed (trace: 'retain-on-failure').
      - if: ${{ failure() && !needs.prove.outputs.head }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      # Every test's time, green or red, for refreshing the timings the parts
      # are planned with (scripts/e2e/timings.mjs).
      - if: ${{ always() && !needs.prove.outputs.head }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ strategy.job-index }}
          path: e2e-report.json
          retention-days: 30
          if-no-files-found: ignore
