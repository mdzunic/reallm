<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0f14" />
    <!-- SPEC-059 §4.6.1: what a shared link previews — absolute URLs, as Open
         Graph requires (Vite leaves external URLs alone); the canonical URL is
         `SHARE_URL` (`src/systems/Share.ts`). The copy spoils nothing. -->
    <meta name="description" content="Earth sent the Selection to find a new home. Six worlds, one salvager, and a feeling you have done this before." />
    <link rel="canonical" href="https://mdzunic.github.io/reallm/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ReaLLM" />
    <meta property="og:title" content="ReaLLM" />
    <meta property="og:description" content="Earth sent the Selection to find a new home. Six worlds, one salvager, and a feeling you have done this before." />
    <meta property="og:url" content="https://mdzunic.github.io/reallm/" />
    <meta property="og:image" content="https://mdzunic.github.io/reallm/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A wall of Selection cards, one of them stamped 62." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ReaLLM" />
    <meta name="twitter:description" content="Earth sent the Selection to find a new home. Six worlds, one salvager, and a feeling you have done this before." />
    <meta name="twitter:image" content="https://mdzunic.github.io/reallm/og.png" />
    <meta name="twitter:image:alt" content="A wall of Selection cards, one of them stamped 62." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- SPEC-015 §6: black-translucent puts the iOS status bar over the canvas,
         which is what `viewport-fit=cover` and the per-element safe-area insets
         above are for; anything else letterboxes the game (AC-28). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ReaLLM" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The same mark, rasterized: iOS ignores the manifest icons and reads
         this one for the Home Screen (SPEC-015 §10.1, AC-28). -->
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png" />
    <!-- SPEC-015 §10 (AC-49): no `<link rel="manifest">` here. `vite-plugin-pwa`
         owns the manifest — the `manifest` literal in `vite.config.ts` — and
         injects the one link into the built `index.html` (D-10). -->
    <title>ReaLLM</title>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
