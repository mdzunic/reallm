<!doctype html>
<!--
  SPEC-059 §4.6.3: the link preview, 1200 × 630. `build.mjs` opens this file
  in Playwright's Chromium and screenshots it to `public/og.png`. The frame is
  the prologue's Selection wall (SPEC-051's retake, card 62 a visored ID),
  darkened left to right under the wordmark and the line. The copy spoils
  nothing.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ReaLLM — link preview</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0b0f14;
      }

      .frame {
        position: relative;
        width: 1200px;
        height: 630px;
        background: #0b0f14 url('../../../public/assets/films/posters/prologue_selection.webp') center / cover no-repeat;
      }

      .frame::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(5, 8, 12, 0.94) 0%, rgba(5, 8, 12, 0.82) 38%, rgba(5, 8, 12, 0.35) 70%, rgba(5, 8, 12, 0.1) 100%);
      }

      .copy {
        position: absolute;
        left: 72px;
        top: 50%;
        transform: translateY(-50%);
        width: 560px;
        font-family: ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace;
        color: #e6edf3;
      }

      .wordmark {
        margin: 0 0 22px;
        font-size: 112px;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-shadow: 0 0 24px rgba(76, 154, 255, 0.45);
      }

      .line {
        margin: 0;
        font-size: 30px;
        line-height: 1.35;
        color: #c3ced8;
      }

      .rule {
        width: 96px;
        height: 3px;
        margin: 0 0 26px;
        background: #4c9aff;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="copy">
        <p class="wordmark">ReaLLM</p>
        <div class="rule"></div>
        <p class="line">Six worlds, one salvager, and a feeling you have done this before.</p>
      </div>
    </div>
  </body>
</html>
